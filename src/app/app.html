<div class="shell">
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" routerLink="/" aria-label="Recall home">
        <span class="brand__mark">R</span>
        <span class="brand__name">Re<b>call</b></span>
      </a>

      @if (auth.isAuthenticated()) {
        <div class="topbar__right">
          <span class="topbar__user">{{ auth.user()?.email }}</span>
          <button class="btn btn--ghost btn--sm" (click)="signOut()">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Sign out
          </button>
        </div>
      }
    </div>
  </header>

  <main class="shell__body">
    <router-outlet />
  </main>
</div>

<div class="toast-host">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast" [class.toast--error]="t.kind === 'error'" (click)="toast.dismiss(t.id)">
      {{ t.message }}
    </div>
  }
</div>
