<div class="container page">
  <section class="panel narrow rise">
    <span class="kicker">Reset password</span>
    <h1 class="narrow__title">Choose a new password</h1>

    @if (!token()) {
      <p class="narrow__note">This reset link is incomplete. Open the link from the email again, or ask for a new one.</p>
      <a class="btn btn--accent btn--block" routerLink="/login">Back to sign in</a>
    } @else {
      <p class="narrow__note">After the reset, every device signed in to your account is signed out.</p>
      <form (ngSubmit)="submit()">
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" class="input" type="password" autocomplete="new-password"
                 placeholder="at least 6 characters"
                 [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" />
        </div>
        <div class="field" style="margin-top: 16px">
          <label for="confirm-password">Repeat new password</label>
          <input id="confirm-password" class="input" type="password" autocomplete="new-password"
                 [ngModel]="confirm()" (ngModelChange)="confirm.set($event)" name="confirm" />
        </div>
        <button class="btn btn--accent btn--block btn--lg" type="submit" [disabled]="busy()"
                style="margin-top: 26px">
          @if (busy()) {
            <span class="spinner" style="width:18px;height:18px;border-width:2px"></span>
          } @else {
            Set new password
          }
        </button>
      </form>
    }
  </section>
</div>
