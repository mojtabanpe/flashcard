name: Test and deploy Recall
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recall-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall-ci
          POSTGRES_DB: recall
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U recall -d recall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:16379
      DATABASE_TEST_URL: postgres://recall:recall-ci@127.0.0.1:5433/recall
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --watch=false
      - run: pnpm api:test
  package:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build production image
        env:
          RELEASE: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "flashcard:$RELEASE" .
          docker save "flashcard:$RELEASE" | gzip > deploy/image.tar.gz
          tar -czf release.tar.gz -C deploy compose.yml release.sh image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recall-release
          path: release.tar.gz
          retention-days: 7
  deploy:
    needs: package
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recall-release
      - name: Upload and deploy over verified SSH
        env:
          DEPLOY_HOST: '194.48.198.106'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/recall
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/recall ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/recall -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$DEPLOY_PORT")
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/recall/releases/$RELEASE"
          scp -i ~/.ssh/recall -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/recall/releases/$RELEASE/release.tar.gz"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/recall/releases/$RELEASE && tar -xzf release.tar.gz && bash release.sh $RELEASE"
