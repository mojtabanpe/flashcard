name: Test and deploy Recall
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recall-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall-ci
          POSTGRES_DB: recall
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U recall -d recall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:16379
      DATABASE_TEST_URL: postgres://recall:recall-ci@127.0.0.1:5433/recall
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --watch=false
      - run: pnpm api:test
  package:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build production image
        env:
          RELEASE: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "flashcard:$RELEASE" .
          docker save "flashcard:$RELEASE" | gzip > deploy/image.tar.gz
          tar -czf release.tar.gz -C deploy compose.yml release.sh image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recall-release
          path: release.tar.gz
          retention-days: 7
  deploy:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment: production
    # The runner lives on the server (user recall-deploy), so no SSH is needed.
    runs-on: [self-hosted, recall]
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recall-release
      - name: Install and start the release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[a-f0-9]{40}$ ]]
          folder="/opt/recall/releases/$RELEASE"
          mkdir -p "$folder"
          cp release.tar.gz "$folder/release.tar.gz"
          cd "$folder"
          tar -xzf release.tar.gz
          bash release.sh "$RELEASE"
